{% extends "base.html" %}
{% block title %}Upload Logs{% endblock %}

{% block content %}
<link rel="stylesheet" href="{{ url_for('static', filename='upload.css') }}">
<script>
    window.onload = function () {
        const params = new URLSearchParams(window.location.search);

        const parsed = params.get("parsed");
        const duplicates = params.get("duplicates");
        const failed = params.get("failed");

        // ✅ NEW
        const totalLogs = params.get("total_logs");
        const insertedLogs = params.get("inserted_logs");
        const parsedPct = params.get("parsed_pct");

        let shouldRedirect = false;

        if (parsed) {
            let msg = "✅ Parsed successfully: " + parsed.split(",").join(", ");

            // ✅ Append stats to toast
            if (totalLogs !== null) {
                msg += ` | Logs: ${insertedLogs}/${totalLogs} (${parsedPct}%)`;
            }

            showToast(msg, "success");
            shouldRedirect = true;
        }

        if (duplicates) {
            showToast(
                "⚠️ Duplicate files skipped: " + duplicates.split(",").join(", "),
                "warning"
            );
        }

        if (failed) {
            showToast(
                "❌ Failed to parse: " + failed.split(",").join(", "),
                "error"
            );
        }

        if (shouldRedirect) {
            setTimeout(() => {
                window.location.href = "{{ url_for('dashboard.dashboard') }}";
            }, 2500);
        }

        if (parsed || duplicates || failed || totalLogs) {
            window.history.replaceState({}, document.title, window.location.pathname);
        }
    };

    function showToast(message, type) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.className = "toast " + type;
        toast.style.display = "block";

        setTimeout(() => {
            toast.style.display = "none";
        }, 3000);
    }

    function showLoader() {
        document.getElementById("loader-overlay").style.display = "flex";
    }
</script>



<!-- Toast -->
<div id="toast" class="toast"></div>

<!-- Loader -->
<div id="loader-overlay">
    <div class="loader-box">
        <div class="spinner"></div>
        <p style="margin-top: 15px;">Uploading & parsing logs…</p>
    </div>
</div>

<div class="upload-container">

    <div class="upload-title">📤 Upload Log File</div>

    <div class="upload-card">
        <form method="post" enctype="multipart/form-data" onsubmit="showLoader()">

            <div class="form-grid">

                <div class="form-group">
                    <label>Environment</label>
                    <select name="environment_id" required>
                        <option value="">-- Select Environment --</option>
                        {% for env in environments %}
                        <option value="{{ env[0] }}">{{ env[1] }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label>Select File</label>
                    <input type="file" name="files" multiple required>
                </div>

            </div>

            <button type="submit" class="upload-btn"><i class="fa-solid fa-upload"></i> Upload</button>

            <div class="upload-hint">
                Supported formats: <b>.txt</b>, <b>.csv</b>, <b>.json</b>, <b>.xml</b>
            </div>
        </form>
    </div>

    <div class="upload-links">
        {% if admin %}
        <a href="{{ url_for('admin.admin_home') }}">⬅ Back to Admin Home</a>
        {% else %}
        <a href="{{ url_for('user_home.home') }}">⬅ Back to User Home</a>
        {% endif %}
    </div>

</div>
{% endblock %}
